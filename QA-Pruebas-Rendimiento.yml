resources:
  repositories:
  - repository: self
    type: git
    ref: refs/heads/pruebas-rendimiento

variables:
  JMETER_THREADS: 5
  JMETER_RAMPUP: 5
  JMETER_DURATION: 30
  JMETER_HOLDTIME: 30

jobs:

- job: Bodegas
  displayName: Pruebas SMOKE - Bodegas
  pool:
    name: ubuntu-latest
  steps:
  - checkout: self
    clean: true

  # ========================
  # Instalar JMeter
  # ========================
  - task: PowerShell@2
    displayName: Instalar JMeter 5.6.3
    inputs:
      targetType: inline
      script: |
        $version = "5.6.3"
        $zip = "apache-jmeter-$version.zip"
        $url = "https://downloads.apache.org/jmeter/binaries/$zip"
        $home = "$(System.DefaultWorkingDirectory)\jmeter"

        if (!(Test-Path $home)) {
          Invoke-WebRequest $url -OutFile $zip
          Expand-Archive $zip -DestinationPath "$(System.DefaultWorkingDirectory)"
          Rename-Item "apache-jmeter-$version" "jmeter"
        }

        $env:PATH = "$home\bin;$env:PATH"
        jmeter -v

  # ========================
  # CARGA (30s)
  # ========================
  - task: PowerShell@2
    displayName: SMOKE - Carga Bodegas
    inputs:
      targetType: inline
      script: |
        jmeter -n `
          -t "$(System.DefaultWorkingDirectory)\pruebas-rendimiento\test\01.Gestion Bodegas\02.Carga_Modulo_Bodegas.jmx" `
          -l "$(System.DefaultWorkingDirectory)\pruebas-rendimiento\results\carga_bodegas.jtl" `
          -e -o "$(System.DefaultWorkingDirectory)\pruebas-rendimiento\dashboard\carga_bodegas" `
          -Jthreads=$(JMETER_THREADS) `
          -JrampUp=$(JMETER_RAMPUP) `
          -Jduration=$(JMETER_DURATION)

  # ========================
  # ESTRÉS (30s)
  # ========================
  - task: PowerShell@2
    displayName: SMOKE - Estres Bodegas
    inputs:
      targetType: inline
      script: |
        jmeter -n `
          -t "$(System.DefaultWorkingDirectory)\pruebas-rendimiento\test\01.Gestion Bodegas\03.Estres_Modulo_Bodegas.jmx" `
          -l "$(System.DefaultWorkingDirectory)\pruebas-rendimiento\results\estres_bodegas.jtl" `
          -e -o "$(System.DefaultWorkingDirectory)\pruebas-rendimiento\dashboard\estres_bodegas" `
          -JtargetConcurrency=$(JMETER_THREADS) `
          -JrampUpTime=$(JMETER_RAMPUP) `
          -JholdTime=$(JMETER_HOLDTIME)

  # ========================
  # PICOS (30s)
  # ========================
  - task: PowerShell@2
    displayName: SMOKE - Picos Bodegas
    inputs:
      targetType: inline
      script: |
        jmeter -n `
          -t "$(System.DefaultWorkingDirectory)\pruebas-rendimiento\test\01.Gestion Bodegas\04.Picos_Modulo_Bodegas.jmx" `
          -l "$(System.DefaultWorkingDirectory)\pruebas-rendimiento\results\picos_bodegas.jtl" `
          -e -o "$(System.DefaultWorkingDirectory)\pruebas-rendimiento\dashboard\picos_bodegas" `
          -JTG_Carga_Base.num_threads=3 `
          -JTG_Pico_Bodegas.num_threads=6

  # ========================
  # RESISTENCIA (30s)
  # ========================
  - task: PowerShell@2
    displayName: SMOKE - Resistencia Bodegas
    inputs:
      targetType: inline
      script: |
        jmeter -n `
          -t "$(System.DefaultWorkingDirectory)\pruebas-rendimiento\test\01.Gestion Bodegas\05.Resistencia_Modulo_Bodegas.jmx" `
          -l "$(System.DefaultWorkingDirectory)\pruebas-rendimiento\results\resistencia_bodegas.jtl" `
          -e -o "$(System.DefaultWorkingDirectory)\pruebas-rendimiento\dashboard\resistencia_bodegas" `
          -Jthreads=3 `
          -Jduration=$(JMETER_DURATION)
